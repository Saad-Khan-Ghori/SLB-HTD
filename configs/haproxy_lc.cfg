global
    log stdout format raw local0 info
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  httpclose
    option  dontlognull
    timeout connect 2000ms
    timeout client  10000ms
    timeout server  10000ms
    timeout check   500ms

frontend http_front
    bind 192.168.20.10:8080
    default_backend http_back_lc

backend http_back_lc
    balance leastconn
    option httpchk GET /health
    http-check expect status 200
    default-server inter 1s fall 3 rise 2
    server b1 172.20.0.11:8001 check
    server b2 172.20.0.12:8002 check
    server b3 172.20.0.13:8003 check
